name: Package iPad Live Photo Importer

on:
  pull_request:
    paths:
      - "LivePhotoImporter.swiftpm/**"
      - ".github/workflows/package-live-photo-importer.yml"
  push:
    branches: [master]
    paths:
      - "LivePhotoImporter.swiftpm/**"
      - ".github/workflows/package-live-photo-importer.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  typecheck-ios:
    runs-on: macos-15
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v4

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Type-check importer against iOS SDK
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun swiftc -parse-as-library -typecheck -target arm64-apple-ios17.0 -sdk "$SDK" LivePhotoImporter.swiftpm/Sources/App.swift

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v4

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Package Swift Playgrounds app
        run: |
          set -euo pipefail
          test -f LivePhotoImporter.swiftpm/Package.swift
          test -f LivePhotoImporter.swiftpm/Sources/App.swift
          zip -r LivePhotoImporter.swiftpm.zip LivePhotoImporter.swiftpm

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: LivePhotoImporter-swiftpm
          path: LivePhotoImporter.swiftpm.zip
          if-no-files-found: error
          retention-days: 30
