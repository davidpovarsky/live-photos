name: Create iPhone Live Photo

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL, Google Drive share link, or Dropbox share link"
        required: true
        type: string
      output_name:
        description: "Output file name (without .livp)"
        required: false
        default: "wallpaper"
        type: string
  pull_request:
    paths:
      - ".github/workflows/create-live-photo.yml"
      - "Package.swift"
      - "Sources/**"
      - "scripts/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          node --version
          bash --version | head -n 1

      - name: Validate shell scripts
        run: |
          bash -n scripts/download-video.sh
          bash -n scripts/make-livp-template-matched.sh

      - name: Validate Node tools
        run: |
          node --check tools/set-livp-zip-comment.js
          node --check tools/dump-mebx-samples.js

      - name: Build Swift packager
        run: swift build

  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TEMPLATE_KEY: ${{ secrets.LIVEPHOTO_TEMPLATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Restore private template
        id: template
        shell: bash
        run: |
          set -euo pipefail

          encrypted="private-assets/intolive-template.zip.enc"
          if [[ ! -f "$encrypted" ]]; then
            echo "::error::Missing $encrypted. Upload the encrypted template asset first."
            exit 1
          fi
          if [[ -z "${TEMPLATE_KEY:-}" ]]; then
            echo "::error::Repository secret LIVEPHOTO_TEMPLATE_KEY is not configured."
            exit 1
          fi

          template_dir="$RUNNER_TEMP/live-photo-template"
          mkdir -p "$template_dir"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted" \
            -out "$RUNNER_TEMP/live-photo-template.zip" \
            -pass env:TEMPLATE_KEY

          unzip -q "$RUNNER_TEMP/live-photo-template.zip" -d "$template_dir"

          template_photo="$(find "$template_dir" -type f \( -iname '*.heic' -o -iname '*.heif' -o -iname '*.jpg' -o -iname '*.jpeg' \) ! -path '*/__MACOSX/*' | head -n 1)"
          template_video="$(find "$template_dir" -type f \( -iname '*.mov' -o -iname '*.mp4' \) ! -path '*/__MACOSX/*' | head -n 1)"

          if [[ -z "$template_photo" || -z "$template_video" ]]; then
            echo "::error::The encrypted template archive must contain one HEIC/JPEG image and one MOV video."
            exit 1
          fi

          echo "photo=$template_photo" >> "$GITHUB_OUTPUT"
          echo "video=$template_video" >> "$GITHUB_OUTPUT"

          echo "Template video:"
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,codec_tag_string,width,height,avg_frame_rate \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 "$template_video"

      - name: Download source video
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          scripts/download-video.sh "$VIDEO_URL" "$RUNNER_TEMP/source-video"

      - name: Generate .livp
        id: generate
        shell: bash
        env:
          REQUESTED_NAME: ${{ inputs.output_name }}
          TEMPLATE_PHOTO: ${{ steps.template.outputs.photo }}
          TEMPLATE_VIDEO: ${{ steps.template.outputs.video }}
        run: |
          set -euo pipefail

          safe_name="$(printf '%s' "${REQUESTED_NAME:-wallpaper}" | tr -cd '[:alnum:]_.-' | sed 's/^\.*//')"
          [[ -n "$safe_name" ]] || safe_name="wallpaper"

          mkdir -p "$RUNNER_TEMP/live-photo-output"
          output="$RUNNER_TEMP/live-photo-output/$safe_name.livp"

          scripts/make-livp-template-matched.sh \
            "$RUNNER_TEMP/source-video" \
            "$output" \
            "$TEMPLATE_PHOTO" \
            "$TEMPLATE_VIDEO"

          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "name=$safe_name" >> "$GITHUB_OUTPUT"

      - name: Upload Live Photo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate.outputs.name }}-live-photo
          path: ${{ steps.generate.outputs.output }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Add run summary
        shell: bash
        run: |
          {
            echo "## Live Photo ready"
            echo
            echo "Output: \`${{ steps.generate.outputs.name }}.livp\`"
            echo
            echo "Open the artifact above, download it on the iPhone/iPad, unzip the artifact ZIP, then open/save the .livp file."
          } >> "$GITHUB_STEP_SUMMARY"
