name: Create iPhone Live Photo

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Google Photos, Google Drive, Dropbox, or direct HTTPS video link"
        required: true
        type: string
      output_name:
        description: "Output file name (without .livp)"
        required: false
        default: "wallpaper"
        type: string
  pull_request:
    paths:
      - ".github/workflows/create-live-photo.yml"
      - "Package.swift"
      - "Sources/**"
      - "scripts/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show toolchain
        run: |
          swift --version
          node --version
          python3 --version
          bash --version | head -n 1

      - name: Validate scripts
        run: |
          bash -n scripts/download-video.sh
          bash -n scripts/make-livp-template-matched.sh
          python3 -m py_compile tools/compact-live-photo-template.py
          python3 -m py_compile tools/repair-compact-live-photo-template.py
          node --check tools/set-livp-zip-comment.js
          node --check tools/dump-mebx-samples.js
          node --check tools/google-photos-video-url.mjs

      - name: Build Swift packager
        run: swift build

  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TEMPLATE_GZ_B64: ${{ secrets.LIVEPHOTO_NEUTRAL_TEMPLATE_GZ_B64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install runtime helpers
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          npm install --no-save --ignore-scripts @marcus5914/google-photos-album-image-url-fetch@1.1.0
          ffmpeg -version | head -n 1
          node --version

      - name: Restore neutral Live Photo metadata template
        id: template
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TEMPLATE_GZ_B64:-}" ]]; then
            echo "::error::Missing Actions secret LIVEPHOTO_NEUTRAL_TEMPLATE_GZ_B64."
            exit 1
          fi

          template_gz="$RUNNER_TEMP/neutral-template.mov.gz"
          template_raw="$RUNNER_TEMP/neutral-template-raw.mov"
          template_mov="$RUNNER_TEMP/neutral-template.mov"

          printf '%s' "$TEMPLATE_GZ_B64" | base64 -D > "$template_gz"
          gzip -dc "$template_gz" > "$template_raw"

          if [[ ! -s "$template_raw" ]]; then
            echo "::error::Could not restore neutral metadata template."
            exit 1
          fi

          # Repairs secrets created by the first compact-template helper, while
          # also harmlessly normalizing already-correct compact templates.
          python3 tools/repair-compact-live-photo-template.py "$template_raw" "$template_mov"

          node tools/dump-mebx-samples.js "$template_mov" > "$RUNNER_TEMP/template-mebx.txt"
          cat "$RUNNER_TEMP/template-mebx.txt"

          if ! grep -q 'samples=57' "$RUNNER_TEMP/template-mebx.txt"; then
            echo "::error::Neutral template does not contain the expected 57-sample live-photo-info track."
            exit 1
          fi

          echo "video=$template_mov" >> "$GITHUB_OUTPUT"

      - name: Download source video
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          scripts/download-video.sh "$VIDEO_URL" "$RUNNER_TEMP/source-video"

      - name: Generate .livp
        id: generate
        shell: bash
        env:
          REQUESTED_NAME: ${{ inputs.output_name }}
          TEMPLATE_VIDEO: ${{ steps.template.outputs.video }}
        run: |
          set -euo pipefail

          safe_name="$(printf '%s' "${REQUESTED_NAME:-wallpaper}" | tr -cd '[:alnum:]_.-' | sed 's/^\.*//')"
          [[ -n "$safe_name" ]] || safe_name="wallpaper"

          mkdir -p "$RUNNER_TEMP/live-photo-output"
          output="$RUNNER_TEMP/live-photo-output/$safe_name.livp"

          scripts/make-livp-template-matched.sh             "$RUNNER_TEMP/source-video"             "$output"             "$TEMPLATE_VIDEO"

          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "name=$safe_name" >> "$GITHUB_OUTPUT"

      - name: Upload Live Photo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate.outputs.name }}-live-photo
          path: ${{ steps.generate.outputs.output }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Add run summary
        shell: bash
        run: |
          {
            echo "## Live Photo ready"
            echo
            echo "Output: \`${{ steps.generate.outputs.name }}.livp\`"
            echo
            echo "Download the artifact, unzip the artifact ZIP, then open/save the .livp file on iPhone."
          } >> "$GITHUB_STEP_SUMMARY"
